version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: docagent_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: docagent_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    container_name: docagent_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/docagent_db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - .:/app
    depends_on:
      - db

  frontend:
    build: .
    container_name: docagent_frontend
    restart: always
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - .:/app
    depends_on:
      - backend

volumes:
  pgdata:
