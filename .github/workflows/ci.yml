name: Continuous Integration - DocAgent Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      # Configura um container PostgreSQL para garantir que os testes de importação/conexão passem
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: docagent_db
        ports:
          - 5432:5432
        # Aguarda o postgres ficar saudável antes de rodar os jobs
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # Ativa o cache automático do pip para deploys mais rápidos

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint and Syntax Validation
      run: |
        # Verifica erros de compilação/sintaxe em todo o diretório de forma nativa
        python -m compileall .

    - name: Test Import of Core Modules
      env:
        DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/docagent_db
        GEMINI_API_KEY: ""
      run: |
        echo "Validando importações dos módulos principais..."
        python -c "import database; print('database.py importado com sucesso!')"
        python -c "import models; print('models.py importado com sucesso!')"
        python -c "import schemas; print('schemas.py importado com sucesso!')"
        python -c "import gemini_service; print('gemini_service.py importado com sucesso!')"
        python -c "import main; print('main.py importado com sucesso!')"
        python -c "import app; print('app.py importado com sucesso!')"
        echo "🎉 Todos os módulos principais importaram com 100% de sucesso e integridade!"
